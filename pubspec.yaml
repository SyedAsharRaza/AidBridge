name: aidbridge
description: "AidBridge - offline disaster mesh SOS network."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.7
  nearby_connections: ^4.3.0
  permission_handler: ^11.3.1
  flutter_foreground_task: ^10.0.0
  shared_preferences: ^2.3.2
  path_provider: ^2.1.4
  geolocator: ^13.0.1
  audioplayers: ^5.2.1
  url_launcher: ^6.2.5
  firebase_core: ^3.8.0
  cloud_firestore: ^5.5.1
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: "^0.14.4"

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/applogo.png"

  # Adaptive settings to auto-scale inside Android safe zones
  adaptive_icon_background: "#FAF6EE"
  adaptive_icon_foreground: "assets/icon/applogo.png"
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/audio/
  fonts:
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk-Regular.ttf
          weight: 400
        - asset: assets/fonts/SpaceGrotesk-Medium.ttf
          weight: 500
        - asset: assets/fonts/SpaceGrotesk-Bold.ttf
          weight: 700
